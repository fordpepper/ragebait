<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gus: a smug face that fits its box (the old emoji favicon spilled off the right edge) -->
  <circle cx="32" cy="32" r="30" fill="#f4d03f"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c9a400" stroke-width="2"/>
  <!-- half-closed, unimpressed eyes -->
  <path d="M15 27.5c3-2.2 8.5-2.2 12 0" fill="none" stroke="#3b2f00" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 27.5c3-2.2 8.5-2.2 12 0" fill="none" stroke="#3b2f00" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="22" cy="30.5" rx="3.2" ry="2.3" fill="#3b2f00"/>
  <ellipse cx="44" cy="30.5" rx="3.2" ry="2.3" fill="#3b2f00"/>
  <!-- one raised eyebrow -->
  <path d="M37 18.5c4-2.6 9-2.6 12.5 0.2" fill="none" stroke="#3b2f00" stroke-width="3" stroke-linecap="round"/>
  <path d="M15 21.5c3.5-0.8 8-0.8 11.5 0.4" fill="none" stroke="#3b2f00" stroke-width="3" stroke-linecap="round"/>
  <!-- smirk -->
  <path d="M23 45c6 2.6 13 2 19-3.4" fill="none" stroke="#3b2f00" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M41.2 39.4l1.6 2.4" fill="none" stroke="#3b2f00" stroke-width="3" stroke-linecap="round"/>
