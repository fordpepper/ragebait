<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>gus</title>
<meta name="description" content="a tiny ai that lives in your browser and exists only to annoy you">
<meta name="theme-color" content="#313338">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="coi.js"></script>
</head>
<body>
<main class="chat">
  <header class="topbar">
    <span class="ava"><img src="icon.svg" alt=""><i class="dot" id="topDot" data-status="online"></i></span>
    <h1>gus</h1>
    <span class="top-status" id="topStatus">online</span>
  </header>

  <div class="scroller" id="scroller">
    <div class="inner">
      <div class="intro">
        <img class="intro-ava" src="icon.svg" alt="">
        <h2>gus</h2>
        <p>This is the beginning of your direct message history with <b>gus</b>.</p>
      </div>
      <div class="loader" id="loader">
        <p class="loader-line" id="loaderLine">checking if gus is already here…</p>
        <div class="bar"><div id="barFill"></div></div>
        <p class="loader-sub" id="loaderSub"></p>
        <button id="download" class="btn" type="button" hidden></button>
      </div>
      <ol class="messages" id="messages" aria-live="polite"></ol>
    </div>
  </div>

  <div class="bottom">
    <form class="composer" id="form" autocomplete="off">
      <div class="box">
        <input id="input" type="text" placeholder="Message @gus" maxlength="400" disabled enterkeyhint="send" aria-label="Message gus">
        <button class="emoji-btn" id="emojiBtn" type="button" title="Emoji" aria-label="Emoji" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.5 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 18a6 6 0 0 1-5.2-3h10.4A6 6 0 0 1 12 18z"/></svg>
        </button>
      </div>
      <div class="picker" id="picker" hidden></div>
    </form>
    <div class="typing" id="typing"><span class="tdots" aria-hidden="true"><i></i><i></i><i></i></span><b>gus</b>&nbsp;is typing…</div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
